name: Update online question bank

on:
  schedule:
    # Every Monday at 02:15 UTC (10:15 CST): advance semester teaching week & sync textbook catalog
    - cron: '15 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crawl curriculum catalog and rebuild semester-progressed question bank
        run: python3 tools/update_online_bank.py --crawl

      - name: Commit updated question bank if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question-bank/
          if git diff --cached --quiet; then
            echo "No changes in question-bank/."
          else
            git commit -m "chore(question-bank): sync curriculum & semester teaching progress"
            git push
          fi
